name: Build unsigned iOS app

'on':
  workflow_dispatch:
  push:
    branches:
      - codex/duo-ui-tweaks

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare build tools
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi

      - name: Download and verify VLCKit
        run: ./scripts/fetch-vlckit.sh

      - name: Generate project
        run: xcodegen generate

      - name: Check metadata and adaptive layout
        run: |
          python3 scripts/test_video_metadata.py
          python3 scripts/test_publication_region.py
          python3 scripts/test_live_adaptive_layout.py

      - name: Build device app
        run: |
          set -o pipefail
          mkdir -p build/cloud
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/cloud/DerivedData -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/cloud/build.log

      - name: Package unsigned IPA
        run: |
          python3 scripts/package_unsigned.py \
            build/cloud/DerivedData/Build/Products/Release-iphoneos/DouDuo.app \
            build/cloud/artifacts
          git rev-parse HEAD > build/cloud/artifacts/source-commit.txt

      - name: Upload unsigned IPA and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DouDuo-unsigned-${{ github.sha }}
          path: build/cloud/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DouDuo-build-log-${{ github.sha }}
          path: build/cloud/build.log
          if-no-files-found: ignore
          retention-days: 7
